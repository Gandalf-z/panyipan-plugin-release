name: 发布盘一盘 Test 插件

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "可选：指定 Gandalf-z/panyipan 的精确提交 SHA；留空则发布 main"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".release-request"

permissions:
  contents: write

concurrency:
  group: panyipan-test-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Gandalf-z/panyipan
  TEST_ENDPOINT: https://panyipan-api.gandaofu.xyz

jobs:
  publish:
    name: 构建并发布 Test Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检查上游只读凭据
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PANYIPAN_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN:-}" ]]; then
            echo "::error::缺少 PANYIPAN_SOURCE_TOKEN。请在本仓库 Actions Secret 中配置仅可读取 Gandalf-z/panyipan 的 fine-grained token。"
            exit 1
          fi

      - name: 读取分发仓库
        uses: actions/checkout@v4
        with:
          path: distribution
          persist-credentials: true
          fetch-depth: 0

      - name: 解析精确上游提交
        id: source_ref
        shell: bash
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_ref="main"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested="$(sed -n 's/^source_sha=//p' distribution/.release-request | head -n 1 | tr -d '[:space:]')"
            if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::.release-request 必须包含 source_sha=<40位提交SHA>"
              exit 1
            fi
            source_ref="$requested"
          elif [[ -n "${DISPATCH_SOURCE_SHA:-}" ]]; then
            requested="$(printf '%s' "$DISPATCH_SOURCE_SHA" | tr -d '[:space:]')"
            if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::workflow_dispatch source_sha 必须是 40 位提交 SHA"
              exit 1
            fi
            source_ref="$requested"
          fi

          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "上游 ref: $source_ref"

      - name: 读取上游源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.source_ref.outputs.ref }}
          token: ${{ secrets.PANYIPAN_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 校验上游 Plugin
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_version_consistency.py
          python3 scripts/check_plugin_build.py
          node scripts/run_plugin_node_tests.js

      - name: 构建 Test 三文件包
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_plugin_release.py \
            --output "$RUNNER_TEMP/panyipan-dist" \
            --environment test

      - name: 准备并验证 BRAT Release 资产
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_version="$(tr -d '[:space:]' < source/VERSION)"
          commit_count="$(git -C source rev-list --count HEAD)"
          source_sha="$(git -C source rev-parse HEAD)"
          source_short="${source_sha:0:12}"
          tag="${base_version}-test.${commit_count}"
          archive="$RUNNER_TEMP/panyipan-dist/panyipan-plugin-${base_version}-test.zip"
          assets="$RUNNER_TEMP/panyipan-assets"

          test -f "$archive"
          rm -rf "$assets"
          mkdir -p "$assets"
          unzip -q "$archive" -d "$assets"

          python3 - "$assets/manifest.json" "$tag" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("id") != "panyipan":
              raise SystemExit("manifest.id 必须为 panyipan")
          manifest["version"] = tag
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python3 - "$assets" "$tag" "$TEST_ENDPOINT" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          endpoint = sys.argv[3]
          expected = {"main.js", "manifest.json", "styles.css"}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f"Release 三文件白名单失败：{sorted(actual)}")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != tag:
              raise SystemExit("manifest.version 与 Release tag 不一致")
          if manifest.get("id") != "panyipan":
              raise SystemExit("manifest.id 不正确")

          main = (root / "main.js").read_text(encoding="utf-8")
          required = (
              'const DISTRIBUTION_ENVIRONMENT = "test";',
              f'const LOCKED_PUBLIC_MARKET_ENDPOINT = "{endpoint}";',
          )
          for marker in required:
              if main.count(marker) != 1:
                  raise SystemExit(f"Test distribution marker 缺失或不唯一：{marker}")

          forbidden = (
              'const DISTRIBUTION_ENVIRONMENT = "dev";',
              'const DISTRIBUTION_ENVIRONMENT = "prod";',
              'const LOCKED_PUBLIC_MARKET_ENDPOINT = "http://127.0.0.1',
              'const LOCKED_PUBLIC_MARKET_ENDPOINT = "http://localhost',
          )
          for marker in forbidden:
              if marker in main:
                  raise SystemExit(f"检测到错误发行标记：{marker}")

          absolute_path_patterns = (
              r"/Users/[^/\s]+/",
              r"/home/[^/\s]+/",
              r"[A-Za-z]:\\Users\\[^\\\s]+\\",
          )
          joined = "\n".join((main, (root / "styles.css").read_text(encoding="utf-8")))
          for pattern in absolute_path_patterns:
              if re.search(pattern, joined):
                  raise SystemExit("检测到本机绝对路径")
          PY

          node --check "$assets/main.js"

          backup_zip="$RUNNER_TEMP/panyipan-plugin-${tag}.zip"
          (
            cd "$assets"
            zip -q -9 "$backup_zip" main.js manifest.json styles.css
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          {
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "source_short=$source_short"
            echo "assets=$assets"
            echo "backup_zip=$backup_zip"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

          echo "Test Release: $tag"
          echo "Source: $source_short"
          echo "Assets: main.js / manifest.json / styles.css"

      - name: 发布 GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHORT: ${{ steps.release.outputs.source_short }}
          ASSETS: ${{ steps.release.outputs.assets }}
          BACKUP_ZIP: ${{ steps.release.outputs.backup_zip }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## 盘一盘 Test Release

          本版本用于当前小范围外部体验。普通测试用户由盘一盘内置 Test 更新通道检查更新；BRAT 保留为高级测试与故障备用方式。

          - 运行通道：Test
          - 上游构建：\`$SOURCE_SHORT\`
          - 安装仓库：\`Gandalf-z/panyipan-plugin-release\`

          Release 中的 \`main.js\`、\`manifest.json\`、\`styles.css\` 是唯一程序资产；ZIP 仅作为故障备用下载。
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$notes" \
            --prerelease \
            "$ASSETS/main.js" \
            "$ASSETS/manifest.json" \
            "$ASSETS/styles.css" \
            "$BACKUP_ZIP"

      - name: 已存在时安全跳过 Release 创建
        if: steps.release.outputs.exists == 'true'
        run: echo "${{ steps.release.outputs.tag }} 已发布；同一上游提交不会重复创建 Release。"

      - name: 生成 Test 更新通道清单
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          set -euo pipefail
          python3 - "$ASSETS" "$TAG" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "distribution/latest-test.json" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import sys

          assets = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          source_sha = sys.argv[3]
          repository = sys.argv[4]
          output = pathlib.Path(sys.argv[5])
          names = ("main.js", "manifest.json", "styles.css")
          payload = {
              "schema_version": 1,
              "channel": "test",
              "version": tag,
              "source_sha": source_sha,
              "published_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "assets": {},
          }
          for name in names:
              path = assets / name
              content = path.read_bytes()
              payload["assets"][name] = {
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "size": len(content),
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{name}",
              }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: 发布稳定 Test 通道指针
        shell: bash
        run: |
          set -euo pipefail
          git -C distribution config user.name "github-actions[bot]"
          git -C distribution config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C distribution add latest-test.json
          if git -C distribution diff --cached --quiet; then
            echo "latest-test.json 无变化"
            exit 0
          fi
          git -C distribution commit -m "chore(release): 更新 Test 通道指针 ${{ steps.release.outputs.tag }}"
          git -C distribution push origin HEAD:main
