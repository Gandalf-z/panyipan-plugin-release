name: Agent License Canonical Patch

on:
  push:
    branches:
      - agent/license-canonical-patch-20260906
    paths:
      - .github/workflows/agent-license-canonical-patch.yml

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Gandalf-z/panyipan
  SOURCE_BRANCH: fix/license-device-canonical-state-20260906
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  patch-private-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检查上游凭据
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PANYIPAN_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN:-}"

      - name: Checkout private source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.PANYIPAN_SOURCE_TOKEN }}
          path: source
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch checked-in runtime from canonical source modules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          ROOT = Path('.')
          CORE = ROOT / 'panyipan-plugin/main-core.js'

          def from_main(path):
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True, encoding='utf-8')

          def current(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def extract_class(text, name):
              marker = f'class {name} {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing class {name}')
              candidates = []
              for next_marker in ('\nclass ', '\nmodule.exports'):
                  pos = text.find(next_marker, start + len(marker))
                  if pos >= 0:
                      candidates.append(pos)
              if not candidates:
                  raise SystemExit(f'cannot find class end for {name}')
              end = min(candidates)
              return text[start:end].rstrip()

          mappings = [
              ('panyipan-plugin/src/services/private-state-storage.js', ['PrivateStateStorage']),
              ('panyipan-plugin/src/services/device-license-state-storage.js', ['DeviceLicenseStateStorage', 'DeviceMirroredStateStorage']),
              ('panyipan-plugin/src/services/local-license-state-store.js', ['LocalLicenseStateStore']),
          ]

          core = CORE.read_text(encoding='utf-8')
          for path, names in mappings:
              old_source = from_main(path)
              new_source = current(path)
              for name in names:
                  old = extract_class(old_source, name)
                  new = extract_class(new_source, name)
                  count = core.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected old runtime class exactly once, got {count}')
                  core = core.replace(old, new, 1)

          old_wiring = '{ mirrorFallback: true, initializedMarker: "license_initialized" }'
          new_wiring = '{ mirrorFallback: false, initializedMarker: "license_initialized" }'
          if core.count(old_wiring) != 1:
              raise SystemExit(f'license wiring match count={core.count(old_wiring)}')
          core = core.replace(old_wiring, new_wiring, 1)
          CORE.write_text(core, encoding='utf-8')
          PY

      - name: Remove temporary private-repo helper files
        working-directory: source
        shell: bash
        run: |
          rm -f .github/workflows/_agent_license_canonical_patch.yml
          rm -f .github/workflows/_agent_license_canonical_patch_ubuntu.yml
          rm -f .github/workflows/_agent_license_canonical_patch_windows.yml
          rm -f scripts/_agent_license_canonical_patch.py

      - name: Regenerate checked-in plugin bundle
        working-directory: source
        run: |
          python scripts/sync_plugin_product_docs.py
          python scripts/generate_plugin_bundle.py

      - name: Focused license tests
        working-directory: source
        run: node --test tests/node_license_device_identity.test.js tests/node_license_diagnostics_repair.test.js tests/node_license_canonical_state.test.js

      - name: Plugin node regression suite
        working-directory: source
        run: node scripts/run_plugin_node_tests.js

      - name: Build and documentation checks
        working-directory: source
        run: |
          python scripts/check_plugin_build.py
          python scripts/check_documentation_hygiene.py
          git diff --check

      - name: Commit and push private source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "panyipan-agent"
          git config user.email "panyipan-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No runtime changes generated"
            exit 1
          fi
          git commit -m "fix(license): 同步设备级授权权威运行时"
          git push origin "HEAD:${SOURCE_BRANCH}"
